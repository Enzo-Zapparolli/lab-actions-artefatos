name: Pipeline Inteligente com Artefatos

on:
  workflow_dispatch:

  schedule:
    - cron: "0 2 * * *"

  push:
    branches:
      - "feature/**"
    paths:
      - "src/**"
      - "!src/docs/**"

jobs:
  job_gerador:
    runs-on: ubuntu-latest

    steps:
      - name: Criar arquivos de relatorio
        run: |
          mkdir saida_build
          echo "Relatorio 1 gerado com sucesso" > saida_build/relatorio1.txt
          echo "Relatorio 2 gerado com sucesso" > saida_build/relatorio2.txt

      - name: Fazer upload dos artefatos
        uses: actions/upload-artifact@v4
        with:
          name: meus-relatorios-oficiais
          path: saida_build/

  job_auditoria:
    runs-on: ubuntu-latest
    needs: job_gerador

    steps:
      - name: Baixar artefatos
        uses: actions/download-artifact@v4
        with:
          name: meus-relatorios-oficiais

      - name: Listar arquivos baixados
        run: ls -R

      - name: Exibir relatorio 1
        run: cat relatorio1.txt
